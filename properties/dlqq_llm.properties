# ===================================================================
#  dlqq_llm · 通用中文对话（GB 级语料，large 档）
#
#  语料：res\dlqq_llm\ —— 75 个 jsonl / 15.6 GB / 约 55 亿字符（字符级模型，1 字 = 1 token）
#          firefly-train-1.1M.jsonl        问答，1.2 GB（约 4 亿字符）
#          pretrain-mix-000~062.jsonl      网页+新闻+维基+百科，12.6 GB（约 45 亿字符）
#          pretrain-wiki-000~010.jsonl     中文维基正文，1.9 GB（约 6.8 亿字符）
#        语料不进版本库，需自备（清洗/下载脚本见 AIRES.md）。
#  模型：8 层 / 8 头 / 512 维 · 约 31.4 M 参数（词表 12,000）
#  用法：双击 .runtime\start.bat，在「训练」页选这个配置；训练完在「对话」页选 dlqq_llm。
# ===================================================================

# ---- 语料与输出 ----------------------------------------------------
# 语料目录；目录里的问答 jsonl 会拼成「用户：…／助手：…」，{"text": …} 当纯文本
data_path=res/dlqq_llm
# 模型名（不用写后缀，自动存到 HF 标准目录 model\<名字>\）
model=dlqq_llm
# 切词缓存（.cache 已纳入版本控制，缓存内容不入库；第一次切 15.6 GB 约 16 分钟，之后复用）
cache_dir=.cache

# ---- 对话 ----------------------------------------------------------
# 加载模型时读取；改完不用重训，优先级：显式参数 > 本文件 > 模型文件里存的 > 默认值
chat_mode=true
# 小模型不要放太开；0.6 / top_k 30 比 0.8 / 40 稳定
chat_temperature=0.6
chat_top_k=30
# 上下文 256 字，生成留 100 字，其余留给用户问题
chat_max_new=100

# ---- 模型结构 ------------------------------------------------------
# large 档；8 GB 显存的上限附近，再大就要开 grad_accum 或 grad_checkpoint
n_layer=8
n_head=8
n_embd=512
block_size=256
batch_size=32

# ---- 训练 ----------------------------------------------------------
# 每步 32 × 256 = 8,192 token；150,000 步 ≈ 12.3 亿 token ≈ 语料 22%
# 参考：80,000 步 ≈ 计算最优（31.4 M 参数 × 20 token/参数）；
#       676,000 步 = 跑满一轮；只是试跑改成 5,000
max_iters=150000
# 长训练不必每 100 步评估；500 步一次、每次 30 批，减少评估开销
# 验证集从 0.5% 提到 1%，降低“偶然变好”造成的假 checkpoint
eval_interval=500
eval_iters=30
lr=0.0003
weight_decay=0.1
grad_clip=1.0
# 语料已经远多于参数（55 亿 token / 31.4 M 参数），dropout 调小一点，让模型多吃数据
dropout=0.05
seed=1337

# ---- 长训练选项 ----------------------------------------------------
# 显存不够时把 grad_accum 调到 2~4，用等效 batch 换显存
grad_accum=1
# 15 万步的长训练，前 1,000 步线性预热，避免一开始 lr 过大把权重带偏
warmup_iters=1000
lr_decay=cosine
min_lr_frac=0.1
# 省显存模式：慢 20~30%，batch / block 调不下来时再开
grad_checkpoint=false
# 0 = 不额外定时存；>0 = 每 N 步强制保存一份（用于中断回退）
save_every=5000

# ---- 存档体积 ------------------------------------------------------
# fp32 权重 + 优化器 ≈ 380 MB；checkpoint 始终带优化器，根目录只保留最佳权重
save_dtype=fp32
# 0 = 不保留；-1 = 不限制；>0 = 保留最近 N 个
keep_best_checkpoints=1
keep_forced_checkpoints=1

# ---- 词表 ----------------------------------------------------------
# 8,600 万字符的抽样里出现 15,228 个不同字符（简繁混排），top 12,000 已覆盖 99.995%，
# 再往上加只是给生僻字留位置，收益很小
max_vocab=12000
# 从语料尾部切 1% 做验证集；0.5% 的验证噪声偏大，容易误判“变好”
val_frac=0.01

# ---- 运行环境 ------------------------------------------------------
# 训练 / 对话统一使用项目内置 .runtime\python；训练依赖请在 WebUI「环境」页安装。
