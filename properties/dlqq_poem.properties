# ===================================================================
#  dlqq_poem · 写诗填词（纯续写模型）
#
#  语料：res\dlqq_poem\ —— 三个来源，共约 115 MB / 3,920 万 token。
#        语料不进版本库，用 .ai_res\script\fetch_poem_corpus.bat 下载：
#          shici   唐宋元明清诗（modelscope/chinese-poetry-collection）
#          songci  宋词（peaceminuczy/songci）
#          modern  近现代诗（Iess/chinese_modern_poetry，走 hf-mirror 国内镜像）
#  模型：6 层 / 6 头 / 384 维 · 约 14.1 M 参数 · 15,000 步 · 8 GB 显存约 30 分钟。
#  用法：双击 .runtime\start.bat，在「训练」页选这个配置；训练完在「对话」页选 dlqq_poem。
#
#  语料只有诗词正文，没有「诗：」「词：」这类标注，所以它只会往下写诗，
#  不会把标注当内容复读。
# ===================================================================

# ---- 语料与输出 ----------------------------------------------------
# 语料目录：shici-000.jsonl / songci-000.jsonl / modern-000.jsonl，按文件名排序合并
data_path=res/dlqq_poem
# 模型名（不用写后缀，自动存到 HF 标准目录 model\<名字>\）
model=dlqq_poem
# 切词缓存（.cache 已纳入版本控制，缓存内容不入库）
cache_dir=.cache

# ---- 对话 ----------------------------------------------------------
# 加载模型时读取；改完不用重训，优先级：显式参数 > 本文件 > 模型文件里存的 > 默认值
# 纯续写模型：提示词前面不加「用户：／助手：」
chat_mode=false
# 1.0 + 不截断：小模型用 0.8/40 容易陷入「他的女人，他的女人」这种循环
chat_temperature=1.0
chat_top_k=0
# 上下文 256 字，生成留 160 字；再长容易从一首滑到另一首
chat_max_new=160

# ---- 模型结构 ------------------------------------------------------
# 约 3,920 万 token / 1,400 万参数 ≈ 2.8 token/参数；诗词句式重复度高，
# 这个比例够学格律，再大就开始整首整首地背
n_layer=6
n_head=6
n_embd=384
# 现代诗平均 210 字、90% 在 136 字内，256 能完整装下一首；只比 128 慢约 6%
block_size=256
# 32 × 256 = 每步 8,192 token
batch_size=32

# ---- 训练 ----------------------------------------------------------
# 15,000 步 ≈ 1.23 亿 token ≈ 语料 3.1 轮，实测约 29 分钟
max_iters=15000
eval_interval=250
eval_iters=50
lr=0.0005
weight_decay=0.1
grad_clip=1.0
dropout=0.1
seed=1337

# ---- 长训练选项 ----------------------------------------------------
grad_accum=1
# 前 200 步抬学习率，后段余弦退火到 5e-5，收敛更稳
warmup_iters=200
lr_decay=cosine
min_lr_frac=0.1
grad_checkpoint=false
# 0 = 只存最优；>0 = 额外定时存档（防止长时间无提升时中断白跑）
save_every=0

# ---- 存档体积 ------------------------------------------------------
# fp16 权重 + 优化器 ≈ 133 MB；默认保留优化器可续训
save_dtype=fp16
save_optimizer=true

# ---- 词表 ----------------------------------------------------------
# 古诗约 9,750 个不重复字符，现代诗更多；7,000 覆盖 99.9% 以上，生僻字丢弃
max_vocab=7000
val_frac=0.02

# ---- 运行环境 ------------------------------------------------------
# 训练 / 对话统一使用项目内置 .runtime\python；训练依赖请在 WebUI「环境」页安装。
