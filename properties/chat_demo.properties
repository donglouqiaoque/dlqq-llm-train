# ===================================================================
#  chat_demo · 最小可跑的对话 demo
#
#  语料：res\chat_demo\chat_demo.jsonl —— 30 条人工智能发展史问答（约 13 KB），
#        仓库自带，不用下载。
#  模型：4 层 / 4 头 / 128 维 · 约 0.9 M 参数 · 3,000 步 · 单卡几十秒。
#  用法：双击 .runtime\start.bat，在「训练」页选这个配置；训练完在「对话」页选它就能对话。
#
#  它的用途是跑通「语料 → 训练 → 对话 → 接进 DSH」整条链路。
#  语料只有几千 token，模型基本是把这些问答背下来，不要指望泛化。
# ===================================================================

# ---- 语料与输出 ----------------------------------------------------
# 语料目录：里面放 jsonl（每行 {"input": 问题, "target": 回答}）
data_path=res/chat_demo
# 模型名（不用写后缀，自动存到 HF 标准目录 model\<名字>\）
model=chat_demo
# 切词缓存（.cache 已纳入版本控制，缓存内容不入库）
cache_dir=.cache

# ---- 对话 ----------------------------------------------------------
# 加载模型时读取；改完不用重训，优先级：显式参数 > 本文件 > 模型文件里存的 > 默认值
chat_mode=true
# 30 条问答、模型基本在背题：温度低一点，减少跑偏
chat_temperature=0.6
chat_top_k=40
# 上下文只有 128 字，生成留 80 字；再长会挤掉提示词，答非所问
chat_max_new=80

# ---- 模型结构 ------------------------------------------------------
# 语料只有约 4,800 token，small 档足够背下来，再大只是多占显存
n_layer=4
n_head=4
n_embd=128
# 128 字装得下一问一答；古诗那种长句才需要 256
block_size=128
batch_size=32

# ---- 训练 ----------------------------------------------------------
# 每步 32 × 128 = 4,096 token；3,000 步 ≈ 1,230 万 token ≈ 语料 2,500 轮
max_iters=3000
eval_interval=200
eval_iters=20
lr=0.0003
weight_decay=0.1
grad_clip=1.0
dropout=0.1
seed=1337

# ---- 长训练选项（这个规模用不到，保持默认即可）----------------------
grad_accum=1
warmup_iters=100
lr_decay=cosine
min_lr_frac=0.1
grad_checkpoint=false
# 0 = 只存最优；>0 = 额外定时存档（防止长时间无提升时中断白跑）
save_every=0

# ---- 存档体积 ------------------------------------------------------
# fp16 权重；默认保留优化器可续训；训练完成后要发布可把 save_optimizer 改 false
save_dtype=fp16
save_optimizer=true

# ---- 词表 ----------------------------------------------------------
# 实际只有 754 个不重复字符，8,000 的上限不会触发截断
max_vocab=8000
# 验证集取 5%（约 240 token）；再小会不足 block_size，脚本会强行缩上下文
val_frac=0.05

# ---- 运行环境 ------------------------------------------------------
# 训练 / 对话统一使用项目内置 .runtime\python；训练依赖请在 WebUI「环境」页安装。
